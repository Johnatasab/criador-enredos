name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar dist
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r src dist/
          touch dist/.nojekyll

      - name: Empacotar artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        uses: actions/deploy-pages@v4